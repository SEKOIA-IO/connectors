name: Assign labels on PR from an organization
on: pull_request
permissions: {}

jobs:
  build:
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: write  # for FiligranHQ/auto-label to add labels to pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setting labels
        uses: FiligranHQ/auto-label@5485ed882430df9a8067a88805a963c9f454e864 # 1.0.0
        with:
          labels_by_organization: "{\"FiligranHQ\":[\"filigran team\"]}"
